name: Build & Release

# Triggered when a version tag is pushed (e.g. v1.0.0, v1.1.0).
on:
  push:
    tags:
      - 'v*'

# One release at a time; never cancel a run that may already be publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build plugin ZIP, and create GitHub Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      zip_name: ${{ steps.zip.outputs.ZIP_NAME }}

    permissions:
      contents: write  # required to create releases and upload assets

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout the tagged commit
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # 2. Toolchain
      #    PHP and Node are build-time only; neither ships with the plugin.
      #    Composer pulls the coding standards used by the quality gate.
      # -----------------------------------------------------------------------
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install PHP tooling
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # 3. Extract version number from the tag (strips the leading "v")
      #    e.g. tag "v1.0.0" → VERSION="1.0.0"
      # -----------------------------------------------------------------------
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 4. Fail fast when the tag and the plugin metadata disagree.
      #    A release whose ZIP reports a different version than its tag is
      #    impossible to support later.
      # -----------------------------------------------------------------------
      - name: Verify version metadata
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          HEADER_VERSION=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([0-9.]*\).*/\1/p' penalis-platform.php | head -n1)
          CONST_VERSION=$(sed -n "s/^define( 'PENALIS_PLATFORM_VERSION', '\([0-9.]*\)' );.*/\1/p" penalis-platform.php | head -n1)
          STABLE_TAG=$(sed -n 's/^Stable tag:[[:space:]]*\([0-9.]*\).*/\1/p' readme.txt | head -n1)

          echo "tag=$VERSION header=$HEADER_VERSION constant=$CONST_VERSION readme=$STABLE_TAG"

          [ "$HEADER_VERSION" = "$VERSION" ] || { echo "::error::Plugin header version ($HEADER_VERSION) does not match tag ($VERSION)."; exit 1; }
          [ "$CONST_VERSION"  = "$VERSION" ] || { echo "::error::PENALIS_PLATFORM_VERSION ($CONST_VERSION) does not match tag ($VERSION)."; exit 1; }
          [ "$STABLE_TAG"     = "$VERSION" ] || { echo "::error::readme.txt Stable tag ($STABLE_TAG) does not match tag ($VERSION)."; exit 1; }

          if ! grep -q "^= ${VERSION} =" readme.txt; then
            echo "::warning::readme.txt has no changelog entry for ${VERSION}."
          fi

      # -----------------------------------------------------------------------
      # 5. Quality gate. Nothing is packaged unless every check passes.
      # -----------------------------------------------------------------------
      - name: PHP coding standards
        run: composer lint

      - name: PHP tests
        run: composer test

      - name: Frontend lint, types, tests, and build
        run: npm run check

      # -----------------------------------------------------------------------
      # 6. Build the distributable ZIP
      #    Only runtime files are included. The React dashboard is compiled into
      #    build/ here because that directory is not tracked in Git.
      # -----------------------------------------------------------------------
      - name: Build ZIP
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PLUGIN_SLUG="penalis-platform"
          ZIP_NAME="${PLUGIN_SLUG}-${VERSION}.zip"

          for path in penalis-platform.php uninstall.php readme.txt license.txt assets includes templates build; do
            [ -e "$path" ] || { echo "::error::Missing required path: $path"; exit 1; }
          done

          # WordPress requires a single top-level folder matching the plugin slug.
          mkdir -p "/tmp/${PLUGIN_SLUG}"

          cp penalis-platform.php uninstall.php readme.txt license.txt "/tmp/${PLUGIN_SLUG}/"
          cp -r assets includes templates build "/tmp/${PLUGIN_SLUG}/"

          # Ship translations when the directory exists.
          if [ -d languages ]; then cp -r languages "/tmp/${PLUGIN_SLUG}/"; fi

          cd /tmp
          zip -rq "$ZIP_NAME" "${PLUGIN_SLUG}/"
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 7. Inspect the archive: the compiled dashboard must be inside, and no
      #    development files may leak into the release.
      # -----------------------------------------------------------------------
      - name: Validate ZIP contents
        env:
          ZIP_NAME: ${{ steps.zip.outputs.ZIP_NAME }}
        run: |
          unzip -l "$ZIP_NAME"

          if ! unzip -Z1 "$ZIP_NAME" | grep -qx 'penalis-platform/build/manifest.json'; then
            echo "::error::build/manifest.json is missing from the ZIP; the dashboard would not load."
            exit 1
          fi

          if unzip -Z1 "$ZIP_NAME" | grep -qE '^penalis-platform/(src|tests|docs|vendor|node_modules|\.github)/'; then
            echo "::error::Development files leaked into the ZIP."
            exit 1
          fi

          echo "ZIP contents look correct."

      # -----------------------------------------------------------------------
      # 8. Create a GitHub Release and attach the ZIP as a release asset
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          name: "v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Penalis Platform v${{ steps.version.outputs.VERSION }}

            Download the ZIP below and upload it via **WordPress Admin → Plugins → Add New → Upload Plugin**.

            The archive already contains the compiled writing dashboard in `build/`, so no Node.js
            toolchain is required on the server.

            **Requirements:** WordPress 6.0+, PHP 8.2+.

            Release notes are also listed in
            [readme.txt](https://github.com/${{ github.repository }}/blob/main/readme.txt).
          files: ${{ steps.zip.outputs.ZIP_NAME }}
          draft: false
          prerelease: false

      # -----------------------------------------------------------------------
      # 9. Hand the exact validated ZIP off to the production deploy job
      # -----------------------------------------------------------------------
      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: penalis-platform-release-zip
          path: ${{ steps.zip.outputs.ZIP_NAME }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Production deployment to VPS via atomic symlink swap.
  #
  # Runs only after the release job passes every check and publishes the ZIP.
  # Uses the isolated SSH account and server paths configured in the
  # `production` GitHub Environment secrets.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production VPS
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://penalis.com

    permissions:
      contents: read

    steps:
      - name: Download release ZIP artifact
        uses: actions/download-artifact@v8
        with:
          name: penalis-platform-release-zip
          path: .

      - name: Configure SSH client
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload and atomically deploy release on VPS
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ZIP_NAME: ${{ needs.release.outputs.zip_name }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
          POST_DEPLOY_CMD: ${{ secrets.POST_DEPLOY_CMD }}
        run: |
          set -euo pipefail

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version format: $VERSION"
            exit 1
          fi

          REMOTE_BASE="${REMOTE_BASE%/}"
          if ! [[ "$REMOTE_BASE" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$REMOTE_BASE" == *".."* ]]; then
            echo "::error::REMOTE_BASE secret must be a valid non-root absolute path."
            exit 1
          fi

          if ! [[ "$POST_DEPLOY_CMD" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$POST_DEPLOY_CMD" == *".."* ]]; then
            echo "::error::POST_DEPLOY_CMD secret must be a valid absolute executable path."
            exit 1
          fi

          [ -f "$ZIP_NAME" ] || { echo "::error::Missing artifact ZIP: $ZIP_NAME"; exit 1; }

          REL_BASE="${REMOTE_BASE}/releases/penalis-platform"
          REMOTE_ZIP="${REL_BASE}/.incoming-${VERSION}.zip"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$SSH_PORT" \
            "$ZIP_NAME" "${SSH_USER}@${SSH_HOST}:${REMOTE_ZIP}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" \
            "${SSH_USER}@${SSH_HOST}" \
            "VERSION=$(printf '%q' "$VERSION") REL_BASE=$(printf '%q' "$REL_BASE") POST_DEPLOY_CMD=$(printf '%q' "$POST_DEPLOY_CMD") bash -s" <<'REMOTE'
          set -euo pipefail

          INCOMING_ZIP="${REL_BASE}/.incoming-${VERSION}.zip"
          STAGING_DIR="${REL_BASE}/.staging-${VERSION}"
          RELEASE_DIR="${REL_BASE}/${VERSION}"
          CURRENT_LINK="${REL_BASE}/current"
          KEEP_RELEASES=5

          cleanup_temp() {
            rm -rf "$STAGING_DIR" "$INCOMING_ZIP" "${REL_BASE}/.current.next"
          }
          trap cleanup_temp EXIT

          # 1. Extract and validate archive structure
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          unzip -q "$INCOMING_ZIP" -d "$STAGING_DIR"

          [ -f "${STAGING_DIR}/penalis-platform/penalis-platform.php" ] || {
            echo "ERROR: penalis-platform.php missing in extracted archive." >&2
            exit 1
          }
          [ -f "${STAGING_DIR}/penalis-platform/build/manifest.json" ] || {
            echo "ERROR: build/manifest.json missing in extracted archive." >&2
            exit 1
          }

          # 2. Place release with clean read permissions for the web server
          rm -rf "$RELEASE_DIR"
          mv "${STAGING_DIR}/penalis-platform" "$RELEASE_DIR"
          find "$RELEASE_DIR" -type d -exec chmod 755 {} +
          find "$RELEASE_DIR" -type f -exec chmod 644 {} +

          # 3. Record previous target for automatic rollback on failure
          PREV_TARGET=""
          if [ -L "$CURRENT_LINK" ]; then
            PREV_TARGET="$(readlink "$CURRENT_LINK")"
          fi

          rollback() {
            echo "Deploy verification failed; attempting rollback..." >&2
            if [ -n "$PREV_TARGET" ] && [ "$PREV_TARGET" != "$RELEASE_DIR" ] && [ -d "$PREV_TARGET" ]; then
              ln -s "$PREV_TARGET" "${REL_BASE}/.current.next"
              mv -Tf "${REL_BASE}/.current.next" "$CURRENT_LINK"
              sudo "$POST_DEPLOY_CMD" || true
              echo "Rolled back current symlink to previous release." >&2
            fi
          }

          # 4. Atomic symlink swap (plugins/penalis-platform -> releases/.../current -> releases/.../<ver>)
          ln -s "$RELEASE_DIR" "${REL_BASE}/.current.next"
          mv -Tf "${REL_BASE}/.current.next" "$CURRENT_LINK"

          # 5. Reload PHP-FPM (OPcache/realpath_cache) and flush WordPress caches
          if ! sudo "$POST_DEPLOY_CMD"; then
            rollback
            exit 1
          fi

          # 6. Live HTTP smoke check (auto-rollback if site or dashboard fails)
          HOME_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://penalis.com/ || echo '000')"
          DASH_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://penalis.com/dashboard/ || echo '000')"
          echo "Health check: / => ${HOME_CODE}, /dashboard/ => ${DASH_CODE}"

          if [ "$HOME_CODE" != "200" ] || [ "$DASH_CODE" != "200" ]; then
            rollback
            exit 1
          fi

          # 7. Retain the newest releases and prune older directories safely
          ACTIVE_NAME="$(basename "$(readlink "$CURRENT_LINK")")"
          mapfile -t OLD_RELEASES < <(
            find "$REL_BASE" -mindepth 1 -maxdepth 1 -type d ! -name '.*' -printf '%T@ %f\n' \
              | sort -rn \
              | awk '{print $2}' \
              | tail -n +"$((KEEP_RELEASES + 1))"
          )
          for dir in "${OLD_RELEASES[@]}"; do
            if [ "$dir" != "$ACTIVE_NAME" ]; then
              rm -rf "${REL_BASE:?}/${dir}"
              echo "Pruned old release: ${dir}"
            fi
          done

          echo "Deployed penalis-platform v${VERSION} successfully."
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -rf "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
